# CI on PR/push; deploy to GitHub Pages on push to main/master only.
# Pages must be enabled: Settings → Pages → Source: "GitHub Actions"
# https://github.com/DVDemon/VTM/settings/pages

name: VMT Web

on:
  push:
    branches: [main, master]
    paths:
      - 'vmt-web/**'
      - '.github/workflows/vmt-web.yml'
  pull_request:
    paths:
      - 'vmt-web/**'
      - '.github/workflows/vmt-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vmt-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vmt-web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: vmt-web/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
