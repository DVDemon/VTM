# Build VirtualTuringMachine (Qt 5.15.2, macOS x86_64) and attach .app to GitHub Releases on version tags.
#
# CI: push/PR when desktop sources change.
# Release: push a tag v* (e.g. v1.0.0) → zip uploaded to GitHub Releases.

name: macOS Desktop (Qt 5.15.2)

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'VirtualTuringMachine/**'
      - 'CMakeLists.txt'
      - 'tests/**'
      - '.github/workflows/macos-desktop.yml'
  pull_request:
    paths:
      - 'VirtualTuringMachine/**'
      - 'CMakeLists.txt'
      - 'tests/**'
      - '.github/workflows/macos-desktop.yml'
  workflow_dispatch:

concurrency:
  group: macos-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '5.15.2'
  # Qt 5.15.2 macOS kit is x86_64-only (Rosetta on Apple Silicon runners).
  CMAKE_OSX_ARCHITECTURES: x86_64
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  build-macos:
    name: Build & package VTM.app
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: ''
          install-deps: true
          cache: true
          cache-key-prefix: vtm-qt-5152-macos

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DCMAKE_OSX_ARCHITECTURES="${CMAKE_OSX_ARCHITECTURES}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}"

      - name: Build VTM
        run: cmake --build build --target VTM --config Release -j "$(sysctl -n hw.logicalcpu)"

      - name: Locate app bundle
        id: app
        run: |
          set -euo pipefail
          APP="$(find build -name 'VTM.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "VTM.app not found under build/"
            find build -maxdepth 4 -type d -name '*.app' || true
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "Using $APP"

      - name: Bundle Qt frameworks (macdeployqt)
        run: |
          "${QT_ROOT_DIR}/bin/macdeployqt" "${{ steps.app.outputs.path }}" -always-overwrite

      - name: Package zip
        id: package
        env:
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          APP="${{ steps.app.outputs.path }}"
          mkdir -p dist
          if [ "$IS_RELEASE" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          ZIP="dist/VTM-${VERSION}-macOS-Qt${QT_VERSION}-x86_64.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTM-macos-qt5152-x86_64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true
